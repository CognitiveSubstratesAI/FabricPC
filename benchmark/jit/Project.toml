# Isolated environment for the Reactant/XLA JIT benchmark + example (heavy dep —
# kept out of the core FabricPC package). Instantiate then run:
#   julia --project=benchmark/jit -e 'using Pkg; Pkg.instantiate()'
#   julia --project=benchmark/jit benchmark/reactant_jit.jl
#   julia --project=benchmark/jit examples/jit_inference.jl
[deps]
FabricPC = "733d70e2-d01e-4f7f-a093-72992d87e09f"
Reactant = "3c362404-f566-11ee-1572-e11a4b42c853"

[sources]
FabricPC = {path = "../.."}

[compat]
Reactant = "0.2"
julia = "1.12"
