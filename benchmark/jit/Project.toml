# Isolated environment for the Reactant/XLA JIT benchmark (heavy dep — kept out
# of the core FabricPC package). Instantiate then run:
#   julia --project=benchmark/jit -e 'using Pkg; Pkg.instantiate()'
#   julia --project=benchmark/jit benchmark/reactant_jit.jl
[deps]
Reactant = "3c362404-f566-11ee-1572-e11a4b42c853"

[compat]
Reactant = "0.2"
julia = "1.12"
